name: AWS What's New
description: AWS What's New announcements (page-based JSON API, full-history backfill capable)
kind: json-api
# `whats-new-v2` is the active directoryId that backs the current
# aws.amazon.com/new/ landing page. The legacy `whats-new` directoryId is
# frozen at 2024-05-17 (16,281 items) and no longer ingests new posts. We
# discovered v2 by grepping the rendered HTML of /new/ for `whats-new-v2`.
url: https://aws.amazon.com/api/dirs/items/search?item.directoryId=whats-new-v2&sort_by=item.additionalFields.postDateTime&sort_order=desc&size=100&page=0&item.locale=en_US
tags:
  - aws
  - cloud
# `filters.keywords` is intentionally left empty — `radar source add` callers
# pick keywords per workspace via `--keywords` (ADR-0012 §D3 strategy A). For
# reference, common Bedrock / Claude / agent-watching keyword sets:
#
#   --keywords "Bedrock,Claude,agents,Inferentia"
#   --keywords "RDS,Aurora,DynamoDB"        # database watchers
#   --keywords "Lambda,Step Functions"      # serverless watchers
#
# Empty keywords match every item — useful for raw firehose ingest, but
# almost every user will want to narrow this.
filters:
  keywords: []
  excludeKeywords: []
  matchMode: word
  matchFields:
    - title
    - summary
  caseSensitive: false
http:
  method: GET
  headers:
    accept: application/json
pagination:
  type: page
  param: page
  start: 0
  pageSize: 100
  pageSizeParam: size
  # 250 pages * 100 items/page = 25,000 items. `whats-new-v2` reports
  # `totalHits: ~21,834` (2026-05 observation), so a full `--backfill`
  # completes well within the cap with ~3,166 items / ~1.2 years of
  # headroom at AWS's observed ~2,500 announcements/year rate. The
  # bundled-recipe ceiling in `tests/recipes/bundled.test.ts` was lifted
  # to 250 in lockstep (defense-in-depth, ADR-0012 §D5). Issue #230
  # raised the cap from the previous 200 because that left the oldest
  # ~1,800 posts unindexed. `--backfill --max-pages N` can narrow further.
  maxPages: 250
  # `metadata.totalHits` is the AWS-reported total; the adapter uses it to
  # short-circuit backfill once `ceil(totalHits / pageSize)` pages have been
  # walked (ADR-0012 §D2 backfill early-stop hint).
  totalPath: $.metadata.totalHits
jsonSelectors:
  # Each result is wrapped in `{ "item": { ... } }`, so we dereference one
  # extra level inside `items[*].item` to keep the per-element selectors
  # rooted at the actual record.
  items: $.items[*].item
  title: $.additionalFields.headline
  # `headlineUrl` is a relative path like `/about-aws/whats-new/.../`. The
  # json-api adapter resolves it against `linkBase` so `Item.url` lands as
  # an absolute URL (#204). `source.url` points at the API endpoint
  # (`aws.amazon.com/api/...`) which would also work as the implicit
  # fallback base, but we declare `linkBase` explicitly here so the recipe
  # documents the intent and is robust if the API endpoint host ever drifts
  # away from the public site host.
  link: $.additionalFields.headlineUrl
  linkBase: https://aws.amazon.com
  publishedAt: $.additionalFields.postDateTime
  summary: $.additionalFields.postBody
  publisherId: $.id
trustLevel: untrusted
