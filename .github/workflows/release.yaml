name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ci.yaml と同じ tool-chain 構成: mise で Node 24 + 共通 lint tool を入れる。
      # publish に必要なのは Node + npm のみだが、ci.yaml と完全に揃えることで
      # build 環境のずれを排除する (sibling 構成と整合)。
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ci.yaml と同じ理由で除外:
          # - trivy: aqua resolver が rate-limit / auth scope で 403
          # - pnpm: aqua plugin が新版 pnpm の .tar.gz なし配布に未対応
          # - uv: aqua attestation 検証が失敗 (provenance lookup None)
          MISE_DISABLE_TOOLS: trivy,pnpm,uv

      # mise が pnpm を入れられないため pnpm/action-setup で別途インストール
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      # node-version: '24' を明示。.mise.toml の node = "24" と一致させ、
      # Node 22 同梱の古い npm (10.x) から npm@latest (11.5+) への大ホップで
      # 発生する promise-retry MODULE_NOT_FOUND を回避する
      # (PR #100 publish 失敗の root cause)。Node 24 同梱の npm は既に新しく、
      # self-upgrade hop が小さいため bug を踏みにくい。setup-node は
      # registry-url (~/.npmrc) 書き込みも担うので削除せず残す。
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # trusted publishing は npm CLI >= 11.5.1 が必須 (Node 24 同梱は通常
      # 11.x 系なので 1 minor bump 程度の小ホップ)。
      - name: Install latest npm (>= 11.5.1 required for trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # 多層防御 (PR #93 の self-link incident への regression guard):
      # workspace 内に self-link (`@ozzylabs/feedradar: "link:"`) が
      # 紛れ込んだ場合、`npm pack` で出来上がる package.json にもそれが
      # 残り、downstream の `npm i` で resolution が壊れる。publish 前に
      # tarball を inspect して link: が含まれていないことを確認する。
      - name: Verify no self-link in packed manifest
        run: |
          shopt -s nullglob
          npm pack --pack-destination /tmp
          tarballs=(/tmp/ozzylabs-feedradar-*.tgz)
          if (( ${#tarballs[@]} == 0 )); then
            echo "ERROR: npm pack produced no tarball."
            exit 1
          fi
          tarball="${tarballs[0]}"
          packed=$(tar -xz --to-stdout -f "$tarball" package/package.json)
          # link: の後にパスがある形式 ("link:../foo") も空 path ("link:") も両方
          # 検出するため、quote 内の link: 接頭辞のみで match する。
          if echo "$packed" | grep -qE '"link:[^"]*"'; then
            echo "ERROR: 'link:' specifier found in packed package.json — refusing to publish."
            echo "$packed"
            exit 1
          fi
          echo "OK: packed manifest contains no link: specifier."

      - name: Publish to npm (OIDC Trusted Publishers)
        run: npm publish --provenance --access public
