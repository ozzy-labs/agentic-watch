name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # mise から pnpm を外している理由は ci.yaml のコメント参照
      # (aqua plugin が pnpm-linux-x64.tar.gz を期待するが新版は .tar.gz なしで配布される)
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # trusted publishing は npm CLI >= 11.5.1 / Node >= 22.14.0 が必須。
      # setup-node が同梱する npm は古い場合があるため明示的に最新を入れる。
      - name: Install latest npm (>= 11.5.1 required for trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # 多層防御 (PR #93 の self-link incident への regression guard):
      # workspace 内に self-link (`@ozzylabs/feedradar: "link:"`) が
      # 紛れ込んだ場合、`npm pack` で出来上がる package.json にもそれが
      # 残り、downstream の `npm i` で resolution が壊れる。publish 前に
      # tarball を inspect して link: が含まれていないことを確認する。
      - name: Verify no self-link in packed manifest
        run: |
          shopt -s nullglob
          npm pack --pack-destination /tmp
          tarballs=(/tmp/ozzylabs-feedradar-*.tgz)
          if (( ${#tarballs[@]} == 0 )); then
            echo "ERROR: npm pack produced no tarball."
            exit 1
          fi
          tarball="${tarballs[0]}"
          packed=$(tar -xz --to-stdout -f "$tarball" package/package.json)
          # link: の後にパスがある形式 ("link:../foo") も空 path ("link:") も両方
          # 検出するため、quote 内の link: 接頭辞のみで match する。
          if echo "$packed" | grep -qE '"link:[^"]*"'; then
            echo "ERROR: 'link:' specifier found in packed package.json — refusing to publish."
            echo "$packed"
            exit 1
          fi
          echo "OK: packed manifest contains no link: specifier."

      - name: Publish to npm (OIDC Trusted Publishers)
        run: npm publish --provenance --access public
