name: recipes-smoke

# ADR-0012 §D3 strategy A: bundled recipes live in the repo and can break when
# upstream sites change their JSON shape. This job is a weekly liveness signal
# that surfaces such drift early — it is intentionally NOT a release blocker
# (recipes are independent of the core library and a single API outage should
# not stall the npm pipeline). Failures emit `::warning::` annotations only.

on:
  schedule:
    # Monday 08:00 UTC — well outside business hours for most operators so a
    # noisy run does not page anyone during the workday. The day-of-week
    # offset keeps weekly cadence simple to reason about.
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: recipes-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Belt-and-suspenders on top of the per-recipe 90 s timeout inside
    # scripts/recipes-smoke.mjs: a runaway harness still bounds total wallclock.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same exclusions as the `ci` job; recipes-smoke only needs node +
          # pnpm to build dist/ and run the smoke script.
          MISE_DISABLE_TOOLS: trivy,pnpm,uv

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (compile dist/ for the smoke script to import)
        run: pnpm run build

      # `continue-on-error: true` keeps the workflow run green even if the
      # harness throws unexpectedly. The script itself already exits 0 on
      # per-recipe failure and emits ::warning:: annotations; this flag is
      # the second layer of "smoke job must not block release".
      - name: Run recipes smoke
        continue-on-error: true
        run: node scripts/recipes-smoke.mjs
