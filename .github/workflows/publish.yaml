name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # 多層防御 (PR #93 の self-link incident への regression guard):
      # workspace 内に self-link (`@ozzylabs/agentic-watch: "link:"`) が
      # 紛れ込んだ場合、`pnpm pack` で出来上がる package.json にもそれが
      # 残り、downstream の `npm i` で resolution が壊れる。publish 前に
      # tarball を inspect して link: が含まれていないことを確認する。
      - name: Verify no self-link in packed manifest
        run: |
          shopt -s nullglob
          pnpm pack --pack-destination /tmp
          tarballs=(/tmp/ozzylabs-agentic-watch-*.tgz)
          if (( ${#tarballs[@]} == 0 )); then
            echo "ERROR: pnpm pack produced no tarball."
            exit 1
          fi
          tarball="${tarballs[0]}"
          packed=$(tar -xz --to-stdout -f "$tarball" package/package.json)
          # link: の後にパスがある形式 ("link:../foo") も空 path ("link:") も両方
          # 検出するため、quote 内の link: 接頭辞のみで match する。
          if echo "$packed" | grep -qE '"link:[^"]*"'; then
            echo "ERROR: 'link:' specifier found in packed package.json — refusing to publish."
            echo "$packed"
            exit 1
          fi
          echo "OK: packed manifest contains no link: specifier."

      - name: Publish to npm (OIDC Trusted Publishers)
        run: pnpm publish --access public --provenance --no-git-checks
