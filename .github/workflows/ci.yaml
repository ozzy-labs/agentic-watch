name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true
          # Explicit token: authenticates mise's aqua / GitHub release lookups
          # (defaults exist but normalize for clarity and future repo rollout).
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Belt-and-suspenders: some mise backends (aqua) read GITHUB_TOKEN
          # from env rather than the action input.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tools skipped in CI:
          # - trivy: local-only security scanner (lefthook pre-commit / dev use).
          #   Resolving aqua:aquasecurity/trivy releases hits 403 (rate limit / auth scope).
          # - pnpm: aqua plugin expects pnpm-linux-x64.tar.gz, but newer pnpm releases
          #   ship the binary without the .tar.gz extension. Installed via
          #   pnpm/action-setup below instead.
          # - uv: aqua attestation verification fails (provenance lookup returns None).
          #   Not used by any CI step, so just skip it.
          MISE_DISABLE_TOOLS: trivy,pnpm,uv

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: biome check .

      - name: Lint (Markdown)
        run: markdownlint-cli2 '**/*.md' '#**/node_modules' '#**/dist'

      - name: Lint (YAML)
        run: yamllint -c .yamllint.yaml .

      - name: Lint (Actions)
        run: actionlint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      # ADR-0005: ensure user data / skill bundle layout never leaks into the
      # published tarball. Fails if the tarball contains anything outside
      # `dist/`, `LICENSE`, `README.md`, or `package.json`.
      - name: Verify pack contents (pnpm pack --dry-run)
        run: |
          set -euo pipefail
          pnpm pack --dry-run --json > pack.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const data = JSON.parse(readFileSync('pack.json', 'utf8'));
            const entry = Array.isArray(data) ? data[0] : data;
            const files = (entry.files ?? []).map(f => f.path);
            // README* / LICENSE* / CHANGELOG* / package.json は npm の仕様で
            // files allowlist 無視で常に tarball に含まれる。README.ja.md は
            // multilingual docs として故意に同梱する。
            const allowed = (p) => (
              p === 'package.json' ||
              p === 'LICENSE' ||
              p === 'README.md' ||
              p === 'README.ja.md' ||
              p.startsWith('dist/')
            );
            const unexpected = files.filter(p => !allowed(p));
            if (unexpected.length > 0) {
              console.error('Unexpected files in npm tarball:');
              for (const p of unexpected) console.error('  - ' + p);
              process.exit(1);
            }
            const required = [
              'dist/index.js',
              'dist/skills/research/SKILL.md',
              'dist/skills/review/SKILL.md',
              'dist/skills/update/SKILL.md',
              'dist/claude-skills/research/SKILL.md',
              'dist/claude-skills/review/SKILL.md',
              'dist/claude-skills/update/SKILL.md',
              'dist/claude-skills/dismiss/SKILL.md',
              'dist/gemini-commands/research.toml',
              'dist/gemini-commands/review.toml',
              'dist/gemini-commands/update.toml',
              'dist/gemini-commands/dismiss.toml',
              'dist/templates/agents/AGENTS.md',
            ];
            const missing = required.filter(p => !files.includes(p));
            if (missing.length > 0) {
              console.error('Missing required files in npm tarball:');
              for (const p of missing) console.error('  - ' + p);
              process.exit(1);
            }
            console.log('pack contents OK (' + files.length + ' files)');
          "

  # Integration tests for the `html-js` adapter (ADR-0010) require a real
  # Chromium binary, so they are split into a dedicated job to keep the unit
  # `ci` job fast. Runs in parallel with `ci` — does not gate it via `needs:`,
  # because integration coverage is orthogonal to lint / typecheck / unit
  # tests and we want both signals to land independently.
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same exclusions as the `ci` job (see comment above); we only need
          # node + pnpm for integration tests.
          MISE_DISABLE_TOOLS: trivy,pnpm,uv

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the Chromium browser binary keyed on the lockfile so a Playwright
      # version bump (recorded in pnpm-lock.yaml) invalidates the cache and
      # triggers a fresh install with the matching browser revision. Without
      # this, the first job run pays ~60-90s for `playwright install`; with the
      # cache hit, subsequent runs skip it entirely.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # `--with-deps` is only needed on a cache miss: on hit, the OS-level
      # libraries are already provisioned by the ubuntu-latest image for the
      # Chromium build we cached. Avoiding the apt step on cache hit shaves
      # another ~15-20s.
      - name: Install Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Test (integration)
        run: pnpm run test:integration
